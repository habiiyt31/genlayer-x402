[project]
name = "genlayer-x402"
version = "0.2.2"
description = "x402 payment contract template library for GenLayer — Paywall, Metered, Subscription, Escrow"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.8"

authors = [
  { name = "habibiiyt", email = "habiiyt31@gmail.com" }
]

license = { text = "MIT" }

keywords = [
  "genlayer",
  "x402",
  "smart-contract",
  "blockchain",
  "payment",
  "web3"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/habiiyt31/genlayer-x402"

[project.scripts]
genlayer-x402 = "genlayer_x402.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["genlayer_x402"]

[tool.setuptools.package-data]
genlayer_x402 = ["*.py"]